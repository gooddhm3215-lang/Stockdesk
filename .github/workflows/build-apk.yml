name: APK 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk StockDesk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StockDesk-apk
          path: StockDesk.apk
      - name: Releases에 게시 (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 종목 분석 데스크 v1.0.${{ github.run_number }}
          body: 폰에서 StockDesk.apk 를 눌러 내려받아 설치하세요.
          files: StockDesk.apk
